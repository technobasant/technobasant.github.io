name: Build and deploy to Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. cancel-in-progress stays false so a queued
# deploy is never killed halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # _config.yml sets `future: false` with `timezone: Asia/Kathmandu` (+0545).
      # A post dated after today is silently dropped from the build with no
      # warning at all, so the page 404s on the live site while the file sits
      # happily in the repo. Fail loudly instead.
      - name: Guard against future-dated posts
        shell: bash
        run: |
          today="$(TZ=Asia/Kathmandu date +%F)"
          echo "Today in Asia/Kathmandu is ${today}"
          shopt -s nullglob
          status=0
          for f in _posts/*.md _posts/*.markdown _posts/*.html; do
            base="$(basename "$f")"
            d="${base:0:10}"
            if [[ ! "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error file=${f}::filename must start with YYYY-MM-DD"
              status=1
              continue
            fi
            if [[ "$d" > "$today" ]]; then
              echo "::error file=${f}::post is dated ${d}, which is after today (${today} in Asia/Kathmandu). _config.yml sets future:false, so Jekyll will drop this post silently. Re-date it or publish it later."
              status=1
            fi
          done
          exit $status

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace

      # Second half of the future-date trap: a post dated *today* but at a time
      # later than the current Kathmandu time is also dropped. Compare what was
      # authored against what actually rendered.
      - name: Assert no post was silently dropped
        shell: bash
        run: |
          shopt -s nullglob
          authored=$(ls _posts/*.md _posts/*.markdown _posts/*.html 2>/dev/null | wc -l | tr -d ' ')
          if [[ ! -f _site/writing/feed.xml ]]; then
            echo "::warning::_site/writing/feed.xml not found, skipping the dropped-post check"
            exit 0
          fi
          if (( authored > 30 )); then
            echo "More than the feed's posts_limit (30) authored; skipping the count comparison."
            exit 0
          fi
          rendered=$(grep -c '<entry>\|<item>' _site/writing/feed.xml || true)
          echo "authored=${authored} rendered=${rendered}"
          if (( rendered < authored )); then
            echo "::error::${authored} post(s) in _posts/ but only ${rendered} in the feed. A future-dated post was dropped by future:false."
            exit 1
          fi

      - name: Check links, images and OpenGraph
        run: bundle exec rake check

      # html-proofer's OpenGraph check reads only og:url and og:image, matches
      # property= but not name=, and says nothing about card type, title length,
      # image dimensions, aspect ratio or file size. This covers the rest, with
      # no network calls and no dependencies.
      - name: Validate social cards
        run: node scripts/check-og.mjs

      - name: Validate published writing
        run: bundle exec rake content

      - name: Install PDF text inspector
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Reject confidential public details
        run: bundle exec rake privacy

      - name: Assert output shape
        run: bundle exec rake verify

      - name: Validate JSON-LD
        run: bundle exec rake jsonld

      # Checks the token matrix, not the rendered sample. axe only sees the
      # colour pairs that exist in today's markup, so a token that fails on a
      # surface no component happens to use yet ships silently and breaks the
      # first time someone uses it.
      - name: Check token contrast (both themes, every surface)
        run: bundle exec rake tokens

      # `rake tokens` proves the palette is sound; it cannot prove the
      # stylesheet uses it. Three AA failures shipped through that gap — a
      # component block that kept a dark-only palette while rendering on paper
      # gave the search field's focus ring 1.82:1 against a 3:1 floor. These
      # two close it from the other side, and unlike a screenshot diff they do
      # not depend on how this runner resolves fonts.
      - name: Check the component layer is token-only
        run: bundle exec rake css:literals

      - name: Check the stylesheet is within budget
        run: bundle exec rake css:budget

      # GitHub's legacy Pages Jekyll does not compile Dart Sass `@use`. If that
      # builder is ever the one that publishes, the live sheet is ~500 bytes of
      # `@use "tokens"` and the site renders unstyled. Fail here rather than
      # uploading that artifact.
      - name: Assert the stylesheet compiled
        run: |
          css=_site/assets/css/site.css
          if [ ! -s "$css" ]; then
            echo "::error::$css is missing or empty"
            exit 1
          fi
          if grep -q '^@use ' "$css"; then
            echo "::error::$css is uncompiled Sass. Pages source must be GitHub Actions, not Deploy from a branch."
            exit 1
          fi
          echo "compiled $(wc -c < "$css" | tr -d ' ') bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # A pull request builds and gets checked, but never touches the live site.
  # workflow_dispatch is allowed so a broken publish can be rebuilt without
  # an empty commit. Pages source must be GitHub Actions — the legacy
  # branch builder cannot compile this stylesheet and will overwrite a good
  # deploy if both are enabled.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # IndexNow and SubmitFeed read CNAME, the public key file, and git history
      # from this checkout. deploy-pages itself uses the build artifact, not
      # these files — checkout is only for the notify steps that follow.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow is the one AI-discoverability lever with measured effect behind
      # it. Bing reports ~22% of clicked URLs originate from IndexNow
      # submissions, and Bing is what feeds Copilot and ChatGPT search — Seer
      # found 87% of SearchGPT citations match Bing's top-10 organic, against
      # 56% for Google. Google never adopted IndexNow, so this does nothing for
      # Google Search; that is fine, the sitemap already covers that path.
      #
      # By contrast llms.txt, which this site already serves, has no measured
      # effect: Google says Search ignores it, and Ahrefs found 97% of the
      # 137,210 domains publishing one got zero crawler requests for the file.
      # Keep it (it costs nothing, coding agents do read it), expect nothing.
      #
      # The key is discovered from the repository, not from a secret.
      #
      # An IndexNow key is not secret — the protocol requires serving it at
      # https://host/<key>.txt so the endpoint can verify ownership. Putting it
      # in a repo secret therefore bought nothing and cost everything: the
      # secret was never set, so this step exited 0 on every deploy for months
      # and submitted nothing. A guard that silently never fires is worse than
      # no guard, which is the whole argument of the essay this repo now hosts.
      #
      # Now the key file IS the configuration. Drop <key>.txt at the root and it
      # works on a fresh clone with no repo settings at all.
      - name: Ping IndexNow
        run: |
          set -euo pipefail
          # Strict: the stem must be 8-128 hex characters, which is the range the
          # protocol allows. A loose `[0-9a-f]*.txt` glob also matches `ai.txt` —
          # "a" is a hex digit — and it sorts first, so the step would have
          # submitted key=ai with a keyLocation pointing at the AI policy file.
          # IndexNow answers 403 to that, and this step deliberately does not
          # fail the deploy on a bad response, so it would have gone quietly back
          # to doing nothing at all.
          keyfile=""
          for f in *.txt; do
            stem="${f%.txt}"
            case "$stem" in *[!0-9a-f]*) continue ;; esac
            [ "${#stem}" -ge 8 ] && [ "${#stem}" -le 128 ] || continue
            keyfile="$f"; break
          done
          if [ -z "$keyfile" ]; then
            echo "no IndexNow key file at the repo root — skipping submission."
            exit 0
          fi
          KEY="${keyfile%.txt}"
          # The endpoint fetches the file and compares its contents to the key.
          # A mismatch is a 403 that would otherwise surface days later in Bing
          # Webmaster Tools, so assert it here where the log is being read.
          if [ "$(cat "$keyfile")" != "$KEY" ]; then
            echo "::error::$keyfile does not contain $KEY — IndexNow would 403."
            exit 1
          fi
          host="$(cat CNAME 2>/dev/null || echo technobasant.github.io)"
          # Bing's guidelines are explicit: "Avoid batch submissions when
          # possible. Streaming submissions provide faster updates, reduce
          # server load, and improve indexing accuracy." Resubmitting all 45
          # URLs on every deploy is the batch case they are describing — most of
          # those URLs did not change, and telling a crawler otherwise is the
          # crawl waste section 21 warns about.
          #
          # So submit only what moved. The sitemap already carries <lastmod>
          # derived from each page's `last_modified_at`, and the previous
          # deploy's commit timestamp is the boundary. If either is unavailable
          # — a first run, a force push — fall back to the full set, because
          # submitting too much once is better than submitting nothing.
          since="$(git log -1 --format=%cI "${{ github.event.before }}" 2>/dev/null || true)"
          all=$(curl -sf "https://$host/sitemap.xml" \
            | tr -d '\n' | grep -o '<url>.*\?</url>' | sed 's|</url>|</url>\n|g')
          if [ -n "$since" ]; then
            urls=$(printf '%s\n' "$all" \
              | awk -v since="$since" '
                  match($0, /<loc>[^<]*<\/loc>/) {
                    loc = substr($0, RSTART+5, RLENGTH-11)
                    mod = ""
                    if (match($0, /<lastmod>[^<]*<\/lastmod>/))
                      mod = substr($0, RSTART+9, RLENGTH-19)
                    if (mod == "" || mod >= since) print loc
                  }' \
              | jq -R . | jq -s .)
            echo "delta since $since"
          else
            urls=$(printf '%s\n' "$all" | grep -o '<loc>[^<]*</loc>' \
              | sed 's|</\?loc>||g' | jq -R . | jq -s .)
            echo "no previous commit available — submitting the full set"
          fi
          if [ "$(echo "$urls" | jq length)" -eq 0 ]; then
            echo "nothing changed since the last deploy — nothing to submit."
            exit 0
          fi
          payload=$(jq -n --arg h "$host" --arg k "$KEY" --argjson u "$urls" \
            '{host:$h, key:$k, keyLocation:("https://"+$h+"/"+$k+".txt"), urlList:$u}')
          code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")
          echo "IndexNow responded $code ($(echo "$urls" | jq length) URLs)"
          # 200 accepted, 202 accepted-pending-key-validation. Anything else is
          # worth seeing in the log but must not fail a deploy that already
          # succeeded — the site is live either way.
          [ "$code" = "200" ] || [ "$code" = "202" ] || cat /tmp/indexnow.out

      # Sitemap submission is the freshness signal (guidelines §3). IndexNow
      # above is the URL-level ping (§4). The API key is a secret; the IndexNow
      # key file is not. Skip quietly if the secret is unset so a missing repo
      # setting cannot fail a deploy that already published.
      - name: Submit sitemap to Bing Webmaster
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BING_WEBMASTER_API_KEY:-}" ]; then
            echo "BING_WEBMASTER_API_KEY secret is not set — skipping SubmitFeed."
            exit 0
          fi
          host="$(cat CNAME 2>/dev/null || echo technobasant.github.io)"
          site="https://$host"
          code=$(curl -sS -o /tmp/bing-feed.out -w '%{http_code}' \
            -X POST "https://ssl.bing.com/webmaster/api.svc/json/SubmitFeed?apikey=${BING_WEBMASTER_API_KEY}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "{\"siteUrl\":\"${site}\",\"feedUrl\":\"${site}/sitemap.xml\"}")
          echo "SubmitFeed responded $code"
          [ "$code" = "200" ] || cat /tmp/bing-feed.out
          # Do not fail the deploy on a Webmaster API miss. The site is live.
          exit 0
