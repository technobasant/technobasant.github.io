# ── Identity ──────────────────────────────────────────────────────────────
title: "Basant Bhattarai"
subtitle: "Data & AI Architect · Senior Data Engineer"
tagline: "Data and AI platforms, end to end: designed, measured, built."
email: contact@basantbhattarai.com.np
description: >-
  Basant Bhattarai — Data & AI Architect, Senior Data Engineer.
  9+ years on production systems in industry: platform architecture, data
  modelling, platform selection, migrations, governance and SOC 2 readiness,
  with AI built into the platform safely and securely.
url: "https://basantbhattarai.com.np"
baseurl: ""
repository: "technobasant/technobasant.github.io"
lang: en

# Site-wide social-card fallback (1200×630 PNG — never AVIF/WebP, LinkedIn and
# Slack will not render those as og:image).
og_image: "/assets/og/og-default-v4.png"

author:
  name: "Basant Bhattarai"
  # Spellings people search for; structured data only (Person.alternateName).
  alternate_names: ["Basanta Bhattarai"]
  # The practice and the employment title, always together. `job_title` is the
  # title held, and the only one structured data states as a fact.
  role: "Data & AI Architect · Senior Data Engineer"
  job_title: "Senior Data Engineer"
  location: "Kathmandu, Nepal"
  avatar: "/assets/images/hero-portrait-v2-840.jpg"
  email: "contact@basantbhattarai.com.np"
  linkedin: "https://www.linkedin.com/in/technobasant"
  github: "https://github.com/technobasant"
  # Person.description in JSON-LD, so third person, with the title held first.
  bio: >-
    Senior Data Engineer at UXCam and data and AI architect, with 9+ years on
    production systems in industry. Leads the architecture of data and AI
    platforms end to end, with governance and AI built in, and builds what he designs.

# ── Build ─────────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/          # posts only; pages declare explicit permalinks
timezone: Asia/Kathmandu
future: false
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
  quiet_deps: true

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - Makefile
  - README.md
  - scripts
  - vendor
  - node_modules
  - _source
  - _templates
  - "*.prev.jpg"
  # Unused: mislabeled JPEG (1024x1024, 172KB) with a .png extension, referenced
  # by nothing. Safe to delete from the repo; excluded so it never ships.
  - assets/images/basant_profile.png
  - _drafts/zzz-scaffold-test.md
  # CV sources. Never part of the site: the CV seeds carry internal names that
  # `rake privacy` rejects.
  - cv

# ── Content ───────────────────────────────────────────────────────────────
collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { path: "", type: pages }
    values:
      layout: page
  - scope: { path: "", type: posts }
    values:
      layout: post
      type: essay
      toc: false
  - scope: { path: "", type: work }
    values:
      layout: case
      kind: production

# ── Plugins ───────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: /writing/feed.xml
  posts_limit: 30
