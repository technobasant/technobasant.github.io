# ── Build ─────────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/          # posts only; pages declare explicit permalinks
timezone: Asia/Kathmandu
future: false
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
  quiet_deps: true

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - Makefile
  - README.md
  - scripts
  - vendor
  - node_modules
  - _source
  - _templates
  - "*.prev.jpg"
  # Unused: mislabeled JPEG (1024x1024, 172KB) with a .png extension, referenced
  # by nothing. Safe to delete from the repo; excluded so it never ships.
  - assets/images/basant_profile.png
  - _drafts/zzz-scaffold-test.md
  # Superseded: duplicated _pages/about.md, had no date/layout/tags, linked from
  # nowhere. Replaced by the three dba-poc posts. Safe to delete from the repo.
  - _posts/2026-08-11-building-data-platforms-and-ai-products.md

# ── Content ───────────────────────────────────────────────────────────────
collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { path: "", type: pages }
    values:
      layout: page
  - scope: { path: "", type: posts }
    values:
      layout: post
      type: essay
      toc: false
  - scope: { path: "", type: work }
    values:
      layout: case
      kind: production

# ── Plugins ───────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: /writing/feed.xml
  posts_limit: 30
