# ── Identity ──────────────────────────────────────────────────────────────
title: "Basant Bhattarai"
subtitle: "Senior Data & AI Engineer · Platform & Database Reliability"
tagline: "I build data platforms that stay correct under load — and the AI agents that sit on top of them."
email: technobasant9@gmail.com
description: >-
  Basant Bhattarai — Senior Data & AI Engineer. Nine years across backend
  engineering, production data platforms, database reliability, and governed
  AI systems. Working US and EU hours.
url: "https://technobasant.github.io"
baseurl: ""
repository: "technobasant/technobasant.github.io"
lang: en

# Site-wide social-card fallback (1200×630 PNG — never AVIF/WebP, LinkedIn and
# Slack will not render those as og:image).
og_image: "/assets/og/og-default-v3.png"

author:
  name: "Basant Bhattarai"
  role: "Senior Data & AI Engineer · Platform & Database Reliability"
  avatar: "/assets/images/portrait-800.jpg"
  email: "technobasant9@gmail.com"
  linkedin: "https://www.linkedin.com/in/technobasant"
  github: "https://github.com/technobasant"
  bio: >-
    Senior Data Engineer focused on reliable data platforms, database systems,
    and governed AI products.

# ── Build ─────────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/          # posts only; pages declare explicit permalinks
timezone: Asia/Kathmandu
future: false
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
  quiet_deps: true

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - Makefile
  - README.md
  - scripts
  - vendor
  - node_modules
  - _source
  - _templates
  - "*.prev.jpg"
  # Unused: mislabeled JPEG (1024x1024, 172KB) with a .png extension, referenced
  # by nothing. Safe to delete from the repo; excluded so it never ships.
  - assets/images/basant_profile.png
  - _drafts/zzz-scaffold-test.md

# ── Content ───────────────────────────────────────────────────────────────
collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { path: "", type: pages }
    values:
      layout: page
  - scope: { path: "", type: posts }
    values:
      layout: post
      type: essay
      toc: false
  - scope: { path: "", type: work }
    values:
      layout: case
      kind: production

# ── Plugins ───────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: /writing/feed.xml
  posts_limit: 30
