# Architecture diagrams, as data.
#
# Why this is HTML and CSS rather than draw.io, Mermaid or an SVG export.
# Four things a diagram on this site has to do, and only real markup does all
# four:
#
#   follow the theme   two first-class themes ship here. A raster or a
#                      draw.io PNG is one palette, and looks wrong in the other.
#   reflow             SVG text does not wrap. At 390px an exported diagram is
#                      either a horizontal scroll or unreadable.
#   be readable        a screen reader announces these steps; a search engine
#                      and a language model index the technology names. Neither
#                      reads a PNG, and alt text cannot carry a topology.
#   stay honest        it is right here in the repo next to the prose, so it
#                      gets updated in the same commit as the thing it describes.
#
# Mermaid does the first three and costs ~1 MB of JavaScript against a
# stylesheet budget currently at 86% of 25 KB. draw.io does none of them, and
# buys prettier vendor icons.
#
# `stage.note` is the load-bearing field. Naming Kafka is a technology list;
# naming what happens when Kafka is unavailable is an architecture diagram.

platform:
  label: "Production data platform — the path a record takes"
  stages:
    - name: "Sources"
      tech: ["mobile SDK", "service events", "CDC"]
      note: "Schema owned upstream, so ingestion cannot assume it is stable."
    - name: "Ingest"
      tech: ["Kafka", "Airflow"]
      note: "Buffered, so a slow downstream is backpressure rather than data loss."
    - name: "Process"
      tech: ["Spark", "PySpark", "dbt"]
      note: "Idempotent by partition — a replay overwrites rather than appends."
    - name: "Store"
      tech: ["Iceberg", "S3"]
      note: "Snapshots make a bad load reversible without restoring a backup."
    - name: "Serve"
      tech: ["Trino", "ClickHouse"]
      note: "Read paths modelled separately from write paths, on purpose."

ai:
  label: "Governed AI delivery — what is allowed to become state"
  stages:
    - name: "Retrieve"
      tech: ["Milvus", "MCP tools"]
      note: "Every claim carries the source record it came from, or it is dropped."
    - name: "Generate"
      tech: ["LangGraph", "Google ADK"]
      note: "Produces a candidate, never final state."
    - name: "Validate"
      tech: ["Pydantic", "policy checks"]
      note: "Typed schema and policy. Failing here is a normal outcome, not an error."
    - name: "Review"
      tech: ["MLflow", "human queue"]
      note: "Publish, correct, or fall back — the fallback path is defined up front."
    - name: "Persist"
      tech: ["PostgreSQL"]
      note: "Durable, attributable, correctable. This is the only write."

clickhomes:
  label: "ClickHomes — listings from feed to page"
  stages:
    - name: "Feed"
      tech: ["RESO Web API"]
      note: "The only way in. Source and rights metadata retained per record."
    - name: "Normalise"
      tech: ["Python", "contracts"]
      note: "Contract violations quarantine the batch instead of the field."
    - name: "Truth"
      tech: ["PostgreSQL"]
      note: "System of record. 90+ versioned migrations, no schema drift by hand."
    - name: "Speed"
      tech: ["ClickHouse"]
      note: "Derived, disposable, rebuildable from Postgres at any time."
    - name: "Serve"
      tech: ["FastAPI", "Next.js"]
      note: "Operational and analytical reads never share a connection pool."

lab:
  label: "Failover experiment — how each claim was measured"
  stages:
    - name: "Provision"
      tech: ["Docker", "Vagrant", "QEMU"]
      note: "One reproducible cluster, pinned versions, stated resource ceiling."
    - name: "Seed"
      tech: ["known dataset"]
      note: "Write verifiable state and capture the baseline before touching anything."
    - name: "Fault"
      tech: ["SIGKILL", "partition"]
      note: "Kill the primary badly. A graceful stop tests a different code path."
    - name: "Measure"
      tech: ["wall clock", "engine metrics"]
      note: "Promotion time, data survival, and what the survivors disagreed about."

lakehouse:
  label: "Lakehouse spine — who holds the credential"
  stages:
    - name: "Engines"
      tech: ["Trino", "StarRocks"]
      note: "Hold no S3 key. They authenticate to the catalog, not to storage."
    - name: "Catalog"
      tech: ["Apache Polaris"]
      note: "Authorisation boundary: principal to role to catalog, then STS."
    - name: "Vend"
      tech: ["STS AssumeRole"]
      note: "Short-lived credential scoped to one table prefix, then discarded."
    - name: "Storage"
      tech: ["Iceberg", "MinIO"]
      note: "Sibling table returns AccessDenied — verified, not assumed."

rag:
  label: "Lakehouse to answer — where the grounding is enforced"
  stages:
    - name: "Land"
      tech: ["robots.txt", "JSONL"]
      note: "Append-only. Everything downstream is derived, so a re-scrape is rare and a re-run is cheap."
    - name: "Refine"
      tech: ["Spark 4", "Delta Lake"]
      note: "Bronze rewrites from raw; silver merges. Only one of those can forget a bad key."
    - name: "Embed"
      tech: ["MiniLM-L6-v2", "Chroma"]
      note: "Chunk id is a hash of the source, so a re-run updates a vector instead of duplicating it."
    - name: "Retrieve"
      tech: ["cosine distance"]
      note: "The grounding boundary. Nothing within threshold means no answer, decided before any inference."
    - name: "Answer"
      tech: ["llama3.2", "FastAPI"]
      note: "Cites the passages it used, or declines. A refusal costs no tokens."

evalproof:
  label: "evalproof — the path from a golden set to an exit code"
  stages:
    - name: "Suite"
      tech: ["YAML", "JSONL"]
      note: "The dataset hash goes into every run; runs on different data refuse to gate (exit 4)."
    - name: "Run"
      tech: ["Ollama", "httpx", "SHA-256 cache"]
      note: "Cached by content: a warm re-run took 0.05 s instead of 363 s, with identical results."
    - name: "Judge"
      tech: ["llm_judge", "calibrate"]
      note: "A classifier with measured error rates: TPR 92.6%, FPR 6.7% against the answer key."
    - name: "Compare"
      tech: ["exact McNemar", "paired bootstrap"]
      note: "Only changed verdicts count: 8 worse against 4 better on 83 cases gave p = 0.39."
    - name: "Gate"
      tech: ["exit codes", "GitHub Actions"]
      note: "Fails only on a drop beyond max_drop at p < alpha; a budget breach has its own exit, 3."

governed-agent:
  label: "governed-agent — what a model's answer must pass to become state"
  stages:
    - name: "Act"
      tech: ["LangGraph", "Ollama"]
      note: "Budgets on turns, tool calls and proposals, plus a deadline; the stop reason is recorded."
    - name: "Query"
      tech: ["MCP", "sqlglot", "DuckDB"]
      note: "One parsed query, re-rendered, on a read-only connection. A proposal is only recorded."
    - name: "Validate"
      tech: ["Pydantic", "policy rules"]
      note: "Not a valid Finding after one repair, or holding contact details: rejected outright."
    - name: "Ground"
      tech: ["cell match"]
      note: "An unmatched number holds the finding. A real figure under the wrong label passes."
    - name: "Review"
      tech: ["FastAPI", "Next.js", "PostgreSQL"]
      note: "Every proposal and held finding waits for a named person and a written reason."
    - name: "Execute"
      tech: ["outbox", "idempotency key"]
      note: "An approved action runs at most once: a unique outbox row, then an idempotency key."

retrieval-bench:
  label: "retrieval-bench — one set of vectors, from corpus to measured recall"
  stages:
    - name: "Corpus"
      tech: ["BEIR", "args.me"]
      note: "986 near-copies of the queries held out; left in, recall read 0.965 at ef_search 10."
    - name: "Embed"
      tech: ["bge-small-en-v1.5", "sentence-transformers"]
      note: "Embedded once at a pinned revision; every engine loads the same float32 arrays."
    - name: "Truth"
      tech: ["numpy"]
      note: "Exact kNN over only the rows that pass the filter, so lost recall is the index's."
    - name: "Engines"
      tech: ["pgvector", "Qdrant", "OpenSearch"]
      note: "At a 10% filter, post-filtered pgvector HNSW returned 3.9 of 10 rows, and no error."
    - name: "Measure"
      tech: ["rbench", "results JSON"]
      note: "Refuses to time off mains power; five interleaved passes, medians, JSON committed."

realtime-ml:
  label: "Real-time fraud scoring — where each failure is built and measured"
  stages:
    - name: "Backfill"
      tech: ["DuckDB", "Parquet"]
      note: "Each row is an entity's state after an event, so training can ask for any instant."
    - name: "Train"
      tech: ["Feast", "LightGBM", "MLflow"]
      note: "Joined 1 ms before each payment; the naive join fell to 0.363 AUC-PR against 0.941."
    - name: "Stream"
      tech: ["Kafka", "Feast push", "Redis"]
      note: "Matched the SQL backfill on 100% of 68,273 rows; a planted defect was caught per feature."
    - name: "Score"
      tech: ["FastAPI", "LightGBM"]
      note: "Served point-in-time features on 99.905% of 9,500 live requests; server p99 under 5 ms."
    - name: "Gate"
      tech: ["evalproof", "MLflow"]
      note: "Promotes only on a significant paired saving within 2 ms p99; refused a reseeded copy."
    - name: "Monitor"
      tech: ["Postgres", "Prometheus"]
      note: "PSI did not see the fraud-tactics drift; the flag rate caught 5 of 5 at 17% false alarms."

streaming-platform:
  label: "Clickstream platform — the path an event takes, counted at every hop"
  stages:
    - name: "Produce"
      tech: ["Avro", "Schema Registry", "Kafka 4.3"]
      note: "Idempotent, acks=all: no failed sends through three broker kills; writes paused ~10 s."
    - name: "Gate"
      tech: ["gatekeeper", "Kafka transactions"]
      note: "One transaction per batch; the dead-letter topic held exactly the injected poison."
    - name: "Dedup"
      tech: ["Flink 1.20", "Iceberg"]
      note: "Both sinks commit on checkpoint; exact through nine failures, aborted writes never read."
    - name: "Window"
      tech: ["Flink SQL", "events.late"]
      note: "Exact in steady state; one broker kill sent 40% of on-time events to the late output."
    - name: "Serve"
      tech: ["ClickHouse", "ReplacingMergeTree"]
      note: "At-least-once ingest made harmless by the event key; queryable at p99 6.1–9.1 s."
    - name: "Alert"
      tech: ["probe exporter", "Prometheus"]
      note: "A probe every 5 s through the front door; a frozen pipeline paged in 59–62 s."

dataset-registry:
  label: "Data ownership registry — the path a dataset takes, from lineage to SLO"
  stages:
    - name: "Discover"
      tech: ["OpenLineage", "Go"]
      note: "Validated against OpenLineage 2-0-2; a dataset seen only in lineage is recorded unowned."
    - name: "Own"
      tech: ["HS256 role tokens", "PostgreSQL 18"]
      note: "Nobody can register as a consumer, or propose a contract, until a team claims it."
    - name: "Check"
      tech: ["Go", "JSON Schema"]
      note: "May over-report, never under-report: 0 of 51 breaking changes passed as safe."
    - name: "Review"
      tech: ["state machine", "partial unique index"]
      note: "Publishes only once every registered consumer acknowledges; one rejection closes it."
    - name: "Watch"
      tech: ["freshness evaluator", "Prometheus"]
      note: "A breach is noticed half an interval late at p50: 7.5 s at the 15 s default."

data-stack-lab:
  label: "data-stack-lab — one synthetic business, each project checked against the known answer"
  stages:
    - name: "Generate"
      tech: ["NumPy", "PyArrow"]
      note: "One seeded SaaS business; the generator also keeps the answers the warehouse never sees."
    - name: "Land"
      tech: ["Airflow 3", "Auto Loader", "DuckDB"]
      note: "A daily DAG lands each day's files; Databricks loads them six ways."
    - name: "Model"
      tech: ["dbt Core", "dbt v2", "PySpark"]
      note: "A Type 2 star schema and three incremental strategies in dbt; a daily rollup in Spark."
    - name: "Test"
      tech: ["unit tests", "mutants"]
      note: "4 of 4 breaks caught; the wrong-version join only by a unit test."
    - name: "Backfill"
      tech: ["dag.test", "scheduler"]
      note: "September four ways; a real backfill matched the harness exactly."
    - name: "Check"
      tech: ["truth files"]
      note: "Type 1: 15.1% misplaced. Newest-first watermarks: 96.56% lost. Static overwrite: 1 of 365 days left."

data-platform-architecture:
  label: "Reference data platform — the path data takes, and the decision behind each stage"
  stages:
    - name: "Ingest"
      tech: ["Kafka", "CDC", "Airflow"]
      note: "Events, database changes and vendor files, each with its own failure model (0001)."
    - name: "Record"
      tech: ["Iceberg", "REST catalog"]
      note: "Open tables; engines get scoped credentials, never keys (0002)."
    - name: "Model"
      tech: ["dbt"]
      note: "Type 2 history for attributes facts are read against (0005); loads by interval (0006)."
    - name: "Serve"
      tech: ["ClickHouse", "Citus", "Trino"]
      note: "By access pattern: tenant-keyed, transactional, analytical (0008)."
    - name: "Operate"
      tech: ["SLO probes", "canaries"]
      note: "Freshness from the reader's side (0007); rehearsed restores (0009)."
    - name: "Choose"
      tech: ["cost model"]
      note: "Per scan or per hour turns on TB scanned per engine-hour (0013)."

ai-platform-architecture:
  label: "AI on governed data — the path an answer takes, and the decision behind each step"
  stages:
    - name: "Ask"
      tech: ["Feature API", "agent graph"]
      note: "The caller's tenant and permissions travel with every call (0001)."
    - name: "Reach data"
      tech: ["MCP tools", "SQL guard"]
      note: "Typed tools only; 0 of 5 planted instructions led to an action (0001)."
    - name: "Call models"
      tech: ["gateway"]
      note: "Budgets, cache and replay: 54 of 54 cases reproduced without a model (0011)."
    - name: "Check"
      tech: ["schema", "grounding"]
      note: "3 of 37 wrong answers still passed every check: the gap to close (0002)."
    - name: "Gate"
      tech: ["paired eval", "budgets"]
      note: "Significance, not deltas; latency and cost with their own exit codes (0004)."
    - name: "Price"
      tech: ["cost model"]
      note: "On price, a GPU beats Sonnet 5 above 196 answers/h, GPT-6 Luna above 3,918 (0013)."

platform-deployments:
  label: "GitOps canary platform — the path a release takes to every pod"
  stages:
    - name: "Commit"
      tech: ["in-cluster Git", "Helm values"]
      note: "A release is a commit to one values file; that file can also switch fault injection on."
    - name: "Sync"
      tech: ["Argo CD", "sync waves"]
      note: "About 15 s from commit to new ReplicaSet; one host stall delayed a sync by 226 s."
    - name: "Admit"
      tech: ["Kyverno", "Pod Security Admission"]
      note: "6 of 6 violating manifests rejected; a Kyverno outage blocks only the app namespace."
    - name: "Canary"
      tech: ["Argo Rollouts", "Envoy sidecar"]
      note: "20% is one pod in five; keep-alive clients sent it only 1.7–10.9% of their requests."
    - name: "Analyse"
      tech: ["Prometheus", "AnalysisRun"]
      note: "p95 judged against stable's; 6 of 6 bad releases aborted, median 30–31 s after Ready."
    - name: "Promote"
      tech: ["AnalysisTemplate"]
      note: "No promotion below 30 canary requests in 3 min; a bad release once shipped on none."

distributed-db-lab:
  label: "Distributed DB lab — Citus, TimescaleDB and ClickHouse, run one at a time"
  stages:
    - name: "Plan"
      tech: ["plan_distribution.py", "pg_catalog"]
      note: "Reads the live catalog and lists all 15 blocking issues before a single table moves."
    - name: "Distribute"
      tech: ["Citus 14.2", "PostgreSQL 17.11"]
      note: "One co-location group by tenant, so a one-tenant query and its joins hit 1 of 32 shards."
    - name: "Rebalance"
      tech: ["citus_rebalance_start", "tenant isolation"]
      note: "0 errors as shards moved under load; the whale's shard, 7.4× the median, needed a split."
    - name: "Time-series"
      tech: ["TimescaleDB 2.30", "continuous aggregates"]
      note: "Raw chunks age out; daily candles, checked against raw, survive the retention drop."
    - name: "Replicate"
      tech: ["ClickHouse 25.8", "ReplicatedMergeTree", "Keeper"]
      note: "2 shards × 2 replicas: with one replica down 60 s, all 40 inserts and 30 reads succeeded."
    - name: "Compare"
      tech: ["one 10M-row dataset", "warm and VM-cold"]
      note: "Same rows in four engines, counts verified equal; each fits a workload, none is crowned."

spark-sql-kinesis:
  label: "spark-sql-kinesis — one micro-batch, from checkpoint to checkpoint"
  stages:
    - name: "Resume"
      tech: ["Spark checkpoint", "offset JSON"]
      note: "Layout unchanged across versions, so a new build resumes the query's own checkpoint."
    - name: "Plan"
      tech: ["ListShards", "avoidEmptyBatches"]
      note: "No unread data on any shard means unchanged offsets and no empty micro-batch."
    - name: "Fetch"
      tech: ["GetRecords", "AWS SDK v2"]
      note: "Stops when millisBehindLatest is 0, so an idle shard costs about one round trip."
    - name: "Decode"
      tech: ["AggregatorUtil", "KPL protobuf"]
      note: "Sub-records keep the parent's sequence number, which is what the checkpoint stores."
    - name: "Commit"
      tech: ["shard-commit", "Hadoop FileContext"]
      note: "Advances only to records emitted downstream: a replay can duplicate, never skip."

clinic-records-ocr:
  label: "Clinic records — from a phone photo to a reviewed timeline entry"
  stages:
    - name: "Capture"
      tech: ["phone camera", "SHA-256"]
      note: "Each page stored once, immutable and checksummed; OCR reads a stripped copy."
    - name: "Queue"
      tech: ["PostgreSQL", "leases"]
      note: "Compare-and-set claims: no page is read twice, and a dead worker's lease expires."
    - name: "Read"
      tech: ["RapidOCR", "ONNX Runtime"]
      note: "Runs in a child process, so a malformed page cannot take the worker down."
    - name: "Extract"
      tech: ["page geometry", "closed vocabularies"]
      note: "A name needs a margin over the runner-up; unreadable rows are refused, not guessed."
    - name: "Review"
      tech: ["clinician", "FHIR R4"]
      note: "Nothing reaches the timeline until a clinician confirms it, in one atomic commit."

consulting-short-text-and-alerting:
  label: "Short-text triage — each distinct meaning classified once"
  stages:
    - name: "Normalise"
      tech: ["Python", "Unicode NFKC"]
      note: "Every comment becomes a key; a small head of distinct strings carries most volume."
    - name: "Cache"
      tech: ["Databricks", "taxonomy version"]
      note: "One label per key and taxonomy version; only cache misses reach a labeller."
    - name: "Discover"
      tech: ["multilingual-e5", "UMAP", "HDBSCAN"]
      note: "New categories come from clusters of distinct strings; one call names a cluster."
    - name: "Approve"
      tech: ["human review"]
      note: "A person approves a category before it labels anything."
    - name: "Assign"
      tech: ["similarity floor", "margin"]
      note: "Past a floor and a margin, or it goes to review or a re-clustered outlier pool."
