upstream:
- project: awslabs/spark-sql-kinesis-connector
  ref: '#99'
  url: https://github.com/awslabs/spark-sql-kinesis-connector/pull/99
  kind: Pull request
  what: Adds an opt-in option, kinesis.stopReadWhenMillisBehindLatestIsZero, so a shard's task stops once
    caught up instead of waiting out empty polls.
  status: Open, awaiting maintainer review
- project: citusdata/citus
  ref: '#7333'
  url: https://github.com/citusdata/citus/issues/7333#issuecomment-6140552778
  kind: Reproduction and offered patch
  what: Confirmed the bug still reproduces on Citus 14.2.0 with PostgreSQL 17.11, adding a minimal repro,
    root cause and an offered patch.
  status: Issue open (bug); no maintainer reply yet
- project: citusdata/citus
  ref: '#4776'
  url: https://github.com/citusdata/citus/issues/4776
  kind: Issue
  what: Reported that adding a primary key without a constraint name failed on a distributed table; Citus
    engineers later implemented support.
  status: Closed as completed; Citus engineers implemented the support in v11.2.0
