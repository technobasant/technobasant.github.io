# Skills are intentionally described without employer scale, topology, or
# operational figures. Public evidence points only to independent work, generic
# writing, or the privacy-safe career summary.

note: >-
  Tiers are self-assessed and deliberately conservative. Tier 1 means sustained
  production use; Tier 2 means meaningful delivery on a narrower surface; Tier 3
  marks working knowledge from evaluation, prototyping, or lab work.

tier1:
  heading: "Sustained production experience"
  blurb: "Technologies I have operated, debugged, and reviewed as part of long-lived systems."
  items:
    - { name: "Python", since: 2017, scale: "Backend services, data platforms, automation, and AI tooling" }
    - { name: "SQL", since: 2017, scale: "Transactional, analytical, and reliability work", evidence: /writing/postgresql-18-docker-volume-path-change/, evidence_label: "PostgreSQL tutorial" }
    - { name: "Apache Spark / PySpark", since: 2020, scale: "Batch and streaming data processing" }
    - { name: "Apache Kafka", since: 2020, scale: "Event-driven and streaming systems" }
    - { name: "Apache Airflow", since: 2020, scale: "Workflow orchestration, replay, and recovery design" }
    - { name: "Apache Iceberg", since: 2022, scale: "Table evolution, maintenance, and data modeling" }
    - { name: "dbt", since: 2021, scale: "Transformation contracts, testing, and documentation" }
    - { name: "PostgreSQL", since: 2017, scale: "Application schemas, replication, HA, backup, and upgrades", evidence: /work/multi-engine-ha-lab/, evidence_label: "failover lab" }
    - { name: "ClickHouse", since: 2021, scale: "Analytical modeling and operational practice" }
    - { name: "Trino", since: 2021, scale: "Federated SQL and query modeling" }
    - { name: "Kubernetes", since: 2022, scale: "Container orchestration and data workloads" }
    - { name: "LangGraph / LangChain", since: 2024, scale: "Production agent orchestration and tool use", evidence: /work/governed-ai-delivery/, evidence_label: "agent case study" }
    - { name: "Google ADK", since: 2024, scale: "Agent applications on an OSS framework, integrated into product workflows", evidence: /work/governed-ai-delivery/, evidence_label: "agent case study" }
    - { name: "MCP", since: 2024, scale: "Tool servers and apps integrated into existing systems", evidence: /work/governed-ai-delivery/, evidence_label: "agent case study" }
    - { name: "Prometheus + Grafana", since: 2021, scale: "Service and data-reliability signals", evidence: /work/multi-engine-ha-lab/, evidence_label: "Reliability lab" }

tier2:
  heading: "Shipped on a narrower surface"
  blurb: "Used to deliver real systems, with less breadth or duration than Tier 1."
  groups:
    - name: "Agentic systems"
      items: [CrewAI, FastMCP, Milvus, MLflow, Pydantic]
    - name: "Data platform"
      items: ["Databricks + Unity Catalog", "Amazon Kinesis", "Spark Structured Streaming", "Debezium / CDC", "Delta Lake"]
    - name: "Databases"
      items: [Redis, MongoDB, Citus, TimescaleDB, "MySQL / MariaDB", "Patroni / pgBackRest"]
    - name: "Product & infra"
      items: [FastAPI, Celery, "Next.js", Docker, Ansible, Terraform, "GitHub Actions", Helm]

