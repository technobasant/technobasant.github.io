# The three problems people actually write to me about.
#
# Why this file exists: the site was legible to an engineer reading it and
# opaque to the person who signs off the engagement. `availability.yml` names
# four *shapes* an engagement takes, but that only renders on /hire/, which is
# not in the header nav — so nothing above the fold said what I get hired for.
#
# The rule here is the same one metrics.yml enforces: every capability names
# the artefact that backs it. `evidence` must point at a case study on this
# site, not at a claim. If a row cannot cite one, it does not belong on the
# homepage.
#
# Order is deliberate: data, then AI, then architecture — the three pillars
# the practice is hired for. Databases used to be a pillar of their own; they
# now sit inside the data row, because a reader deciding whether to call me
# needs "the platform and the stores under it" as one problem, and the
# architecture row is what the database lab was standing in for anyway.

- title: "Data platforms, and the databases under them"
  blurb: >-
    Ingestion, processing and serving that worked at one scale and stopped
    working at the next — and the stores underneath, with failover, backup
    and upgrades your team can run after I leave.
  evidence: /work/data-platform-practice/
  evidence_label: "Rebuilding a production data platform"

- title: "AI systems that have to touch production data"
  blurb: >-
    Agents with typed output, provenance and a review path, and the
    evaluation under them: extraction and classification measured against a
    scorer written before the model ran, with a defined answer for when it
    cannot decide.
  evidence: /work/governed-ai-delivery/
  evidence_label: "Turning model output into auditable product state"

- title: "System architecture with the recovery path designed first"
  blurb: >-
    Where state lives, what is idempotent, what a second delivery does, and
    how the system degrades when a dependency is slow — decided before the
    incident and written down as decisions you can revisit.
  evidence: /work/consulting-short-text-and-alerting/
  evidence_label: "Classification and alerting, redesigned around state"
