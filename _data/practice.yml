# The homepage's "what I'm hired for" rows: one per capability, in the same
# order and with the same ids as the groups on /work/ and /writing/. Each row
# carries its own evidence — a case study, a write-up and the code — because a
# capability claim with nothing behind it would be the one unearned thing on
# the page. `case` and `post` are slugs (checked at build: an unknown slug
# renders nothing), `repo` is a public repository under github.com/technobasant.

- id: data-platforms
  title: "Data platforms that keep working at the next scale"
  blurb: >-
    Ingestion, processing and serving that worked at one scale and stopped at
    the next: streams that stay exact through failure, lakehouse tables you can
    roll back, and contracts that wait for the consumers they would break.
  case: data-platform-practice
  post: exactly-once-records-not-window-counts
  repo: spark-sql-kinesis
  repo_blurb: "Kinesis source and sink for Spark 4, on Maven Central"

- id: ai-systems
  title: "AI systems that have to touch production data"
  blurb: >-
    Agents with typed output, provenance and a review path, and the evaluation
    under them: a gate that can tell a regression from noise, and a defined
    answer for when the model cannot decide.
  case: governed-ai-delivery
  post: eval-score-drop-twelve-answers
  repo: evalproof
  repo_blurb: "LLM evaluation as measurement, gated in CI"

- id: database-lifecycle
  title: "Databases that scale out and survive failure"
  blurb: >-
    Sharding and rebalancing, failover, backup and point-in-time recovery, and
    the upgrades in between, measured on real clusters before anyone depends
    on them.
  case: distributed-db-lab
  post: citus-remove-node-orphaned-cleanup-records
  repo: db-failover-lab
  repo_blurb: "Six engines, eight failover scenarios, measured"

- id: system-architecture
  title: "System architecture with the recovery path designed first"
  blurb: >-
    Where state lives, what is idempotent, what a second delivery does, and how
    a release stops itself when it is bad — decided before the incident and
    written down as decisions you can revisit.
  case: clickhomes
  post: canary-analysis-aborted-good-promoted-bad
  repo: platform-deployments
  repo_blurb: "GitOps with a canary that aborts bad releases"
