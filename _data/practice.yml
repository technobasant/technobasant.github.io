# The homepage's "what I'm hired for" rows: one per problem a team brings, each
# carrying its own evidence — a case study, a write-up and the code — because a
# capability claim with nothing behind it would be the one unearned thing on
# the page. `id` is a capability group on /work/ and sets the row's colour.
# `case` and `post` are slugs (checked at build: an unknown slug renders
# nothing), `repo` is a public repository under github.com/technobasant.

- id: database-lifecycle
  title: "Moving analytics off the product's Postgres"
  blurb: >-
    Reports that slow the product and replicas that cancel them: measure first,
    stop the damage now, then scale out or migrate in stages with a way back.
  case: postgres-scale-out-citus
  post: read-replica-cancelled-the-reports
  repo: data-platform-architecture
  repo_blurb: "A reference architecture: current state measured, 18 decisions"

- id: data-platforms
  title: "Platforms chosen on evidence and run at scale"
  blurb: >-
    A platform picked by a proof of concept with criteria fixed in advance, then
    ingestion, lakehouse and serving that stay correct, recoverable and
    affordable as volume grows.
  case: data-platform-practice
  post: choosing-where-the-data-lives
  repo: spark-sql-kinesis
  repo_blurb: "Kinesis source and sink for Spark 4, on Maven Central"

- id: system-architecture
  title: "Governance an auditor can check"
  blurb: >-
    Classification, masking, contracts and access review designed into the data
    model; SOC 2 controls with the evidence each produces; erasure measured,
    not assumed.
  case: data-platform-architecture
  post: erasure-cost-is-a-modelling-decision
  repo: dataset-registry
  repo_blurb: "Data contracts that wait for the consumers they break"

- id: ai-systems
  title: "AI on governed data, measured before launch"
  blurb: >-
    Assistants and agents over customer data: isolation enforced outside the
    model, the business's definitions in a semantic layer, a release gate that
    tells regression from noise.
  case: governed-ai-delivery
  post: prompt-is-not-tenant-isolation
  repo: ai-platform-architecture
  repo_blurb: "A reference AI architecture: isolation, accuracy and cost measured"
