# Public metrics are limited to reproducible personal work. Employer throughput,
# topology, cost, reliability, customer and team figures do not belong in this
# repository, even when they appeared in an older résumé or public talk.

experience:
  value: "9 years"
  label: "in software engineering"
  method: "role history from 2017–2026"

# --- multi-engine HA lab (personal, measured) ---

lab_scenarios:
  value: "8 of 8"
  label: "failover scenarios passed"
  method: "my own test plan, executed on Docker with 8 CPU / 12.5 GB"
