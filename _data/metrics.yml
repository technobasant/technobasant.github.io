# ── Patroni HA + pgBackRest lab (2026) ───────────────────────────────────────
# Every figure below came off the runs documented in the rhel8-pg-ansible
# series, not from a vendor page. Timings are wall-clock on amd64 guests under
# QEMU TCG, which is slower than real hardware — they are honest ceilings, not
# benchmarks to quote at anyone.
# The value states the sampling window, not a precision the test cannot support.
# "under 20 s" from a 10-second poll implies a resolution the instrument does not
# have: the true promotion could be anywhere from just over 10 s to just under
# 20 s, and a reader is entitled to know which. Naming the interval in the figure
# makes the boundary visible without a click.
lab_patroni_promotion:
  value: "10–20 s"
  label: "observed promotion window after SIGKILL"
  method: "SIGKILL of the Patroni leader, then patronictl polled every 10 s until the survivor showed as Leader — so 10 s is the measurement resolution, not the precision of the result"
  scope: "independent"
  source: "2026 Patroni HA lab"
  window: "2026"
  context: "ttl 30 / loop_wait 10 on a single-node etcd; timeline advanced 1 to 2."

lab_replica_rebuild:
  value: "~5 s"
  label: "replica rebuilt from backup"
  method: "patronictl reinit; the pgBackRest restore itself logged 5,020 ms, then Patroni reported the replica created"
  scope: "independent"
  source: "2026 Patroni HA lab"
  window: "2026"
  context: "22.7 MB database; create_replica_methods put pgbackrest ahead of basebackup so the primary was never read."

lab_pitr_recovery:
  value: "5 of 5"
  label: "rows recovered by point-in-time restore"
  method: "dropped a table, restored to a timestamp taken before the DROP, counted rows against the pre-incident total"
  scope: "independent"
  source: "2026 Patroni HA lab"
  window: "2026"
  context: "pgBackRest --type=time restore into a paused Patroni cluster; recovery ended on timeline 4."

# ── Trino / Iceberg / Polaris lakehouse (2024 build, 2026 rebuild) ───────────
# Server-side query timings read from Trino's own system.runtime.queries, not
# wall clock: the CLI's JVM startup added ~515 ms to every measurement, which
# was 6x the figure being measured.
lakehouse_partition_prune:
  value: "88 ms"
  label: "one-month predicate over 1.5M Iceberg rows"
  method: "median of 7 server-side runs from system.runtime.queries, after 2 warm-ups, on a month-partitioned Iceberg table"
  scope: "independent"
  source: "2026 Trino/Iceberg lakehouse lab"
  window: "measured 2026 · 2024 stack rebuilt"
  context: "The same predicate against Trino's in-memory tpch generator took 615 ms; the gap is partition pruning, not storage speed."

lakehouse_compaction:
  value: "20 → 1"
  label: "files merged per partition by optimize"
  method: "twenty 5,000-row inserts into one partition, then ALTER TABLE EXECUTE optimize, counted from the $files metadata table"
  scope: "independent"
  source: "2026 Trino/Iceberg lakehouse lab"
  window: "measured 2026 · 2024 stack rebuilt"
  context: "Total bytes fell 1,006 KB to 430 KB and the median query on that partition went 184 ms to 69 ms."

lakehouse_rollback:
  value: "909,968"
  label: "rows recovered by snapshot rollback"
  method: "unqualified DELETE, then ALTER TABLE EXECUTE rollback_to_snapshot, counted against the pre-incident total"
  scope: "independent"
  source: "2026 Trino/Iceberg lakehouse lab"
  window: "measured 2026 · 2024 stack rebuilt"
  context: "Completed in 589 ms because a rollback rewrites the current-snapshot pointer rather than moving data."

