---
layout: default
---
<article class="page wrap">
  <header class="page-head">
    <p class="eyebrow">{{ page.eyebrow | default: "Profile" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}<p class="lede">{{ page.excerpt }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
